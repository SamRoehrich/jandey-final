services:
  tailscale:
    image: ghcr.io/tailscale/tailscale:latest
    hostname: jandey-blog
    environment:
      - TS_AUTHKEY=tskey-auth-kCTZNu2q3A21CNTRL-aLX7Dsj7Td2WWWzaUrZ2d2KyGWNVS7yiF
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
    cap_add:
      - net_admin
      - sys_module
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  web:
    build: .
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      # Mount content and images for live updates without rebuild
      - ./content:/app/content:ro
      - ./public/images:/app/public/images:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - web
    restart: unless-stopped

  # Git poller - checks for updates every 5 minutes
  poller:
    image: alpine/git
    volumes:
      - .:/repo
    working_dir: /repo
    entrypoint: /bin/sh
    command: |
      -c "
      echo 'Starting git poller...'
      while true; do
        echo \"[\$(date)] Checking for updates...\"
        git fetch origin main 2>/dev/null
        LOCAL=\$(git rev-parse HEAD)
        REMOTE=\$(git rev-parse origin/main 2>/dev/null)
        if [ \"\$LOCAL\" != \"\$REMOTE\" ] && [ -n \"\$REMOTE\" ]; then
          echo \"[\$(date)] Updates found! Pulling...\"
          git pull origin main
          echo \"[\$(date)] Pull complete. Content will be served immediately.\"
        else
          echo \"[\$(date)] No updates.\"
        fi
        sleep 300
      done
      "
    restart: unless-stopped

volumes:
  tailscale-state:
